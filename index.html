<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Portfolio Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        :root {
            --bg:#07090f; --surface:#0c1018; --border:#1a2535;
            --accent:#38bdf8; --sp:#fbbf24; --nd:#a78bfa;
            --text:#e2e8f0; --muted:#4b6080; --green:#34d399; --red:#f87171;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;padding:20px;min-height:100vh;}
        .wrap{max-width:1100px;margin:0 auto;}
        
        /* Dashboard Cards */
        .cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-bottom:25px;}
        .card{background:var(--surface); border:1px solid var(--border); padding:20px; border-radius:12px; border-top:3px solid var(--accent);}
        .card-lbl{font-family:'Space Mono'; font-size:9px; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
        .card-val{font-size:22px; font-weight:800;}

        /* Chart Section */
        .chart-box{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; margin-bottom:25px;}
        .chart-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
        .btn-range{background:var(--bg); border:1px solid var(--border); color:var(--muted); padding:6px 12px; border-radius:6px; cursor:pointer; font-family:'Space Mono'; font-size:10px; margin-left:5px;}
        .btn-range.active{border-color:var(--accent); color:var(--accent);}
        .chart-container{height:350px; width:100%;}

        /* Input & Table */
        .box{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:20px;}
        .input-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
        input{background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:10px; color:#fff; flex:1; font-family:'Space Mono';}
        .btn-add{background:var(--accent); color:#000; border:none; padding:10px 20px; border-radius:6px; font-weight:800; cursor:pointer;}
        
        table{width:100%; border-collapse:collapse; font-size:13px;}
        th{text-align:left; padding:12px; color:var(--muted); font-family:'Space Mono'; font-size:10px; border-bottom:1px solid var(--border);}
        td{padding:15px 12px; border-bottom:1px solid rgba(26,37,53,0.5);}
        .up{color:var(--green);} .down{color:var(--red);}
    </style>
</head>
<body>

<div class="wrap">
    <header style="margin-bottom:20px;">
        <h1 style="font-size:24px;">Portfolio Dashboard</h1>
        <p style="font-size:11px; color:var(--muted); font-family:'Space Mono';">Live Market Data Active</p>
    </header>

    <div class="cards">
        <div class="card"><div class="card-lbl">Total Value</div><div class="card-val" id="v-total">$0.00</div></div>
        <div class="card"><div class="card-lbl">Total P/L</div><div class="card-val" id="v-pl">0.00%</div></div>
        <div class="card"><div class="card-lbl">Day Change</div><div class="card-val" id="v-day">0.00%</div></div>
    </div>

    <div class="chart-box">
        <div class="chart-header">
            <h3 style="font-size:16px;">Performance vs Benchmarks</h3>
            <div>
                <button class="btn-range" onclick="loadChart(180, this)">6M</button>
                <button class="btn-range active" onclick="loadChart(365, this)">1Y</button>
                <button class="btn-range" onclick="loadChart(730, this)">2Y</button>
            </div>
        </div>
        <div class="chart-container">
            <canvas id="mainChart"></canvas>
        </div>
    </div>

    <div class="box">
        <h3 style="margin-bottom:15px; font-size:14px;">Add New Stock</h3>
        <div class="input-row">
            <input id="inT" placeholder="Symbol (e.g. AAPL)">
            <input id="inS" type="number" placeholder="Shares">
            <input id="inC" type="number" placeholder="Avg Cost">
            <button class="btn-add" onclick="addAsset()">+ Add to Portfolio</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Symbol</th><th>Shares</th><th>Cost</th><th>Market Price</th><th>Equity</th><th>P/L</th><th></th>
                </tr>
            </thead>
            <tbody id="ptf-body"></tbody>
        </table>
    </div>
</div>

<script>
const KEY = 'd819jdhr01qler4hgci0d819jdhr01qler4hgcig';
let portfolio = JSON.parse(localStorage.getItem('my_stocks_v3') || '[]');
let chart;

// 1. DATA FETCHING
async function getLive(symbol) {
    const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${KEY}`);
    return await r.json();
}

async function getHistory(symbol, days) {
    const end = Math.floor(Date.now() / 1000);
    const start = end - (days * 24 * 60 * 60);
    const r = await fetch(`https://finnhub.io/api/v1/stock/candle?symbol=${symbol}&resolution=D&from=${start}&to=${end}&token=${KEY}`);
    const d = await r.json();
    if(d.s === "ok") {
        const first = d.c[0];
        return d.c.map(p => ((p - first) / first) * 100);
    }
    return [];
}

// 2. CHART LOGIC
async function loadChart(days, btn) {
    if(btn) {
        document.querySelectorAll('.btn-range').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    
    const spy = await getHistory('SPY', days);
    const qqq = await getHistory('QQQ', days);
    // Use the first stock in your portfolio as the comparison line
    const ptf = portfolio.length > 0 ? await getHistory(portfolio[0].ticker, days) : spy.map(v => v * 1.1);

    const ctx = document.getElementById('mainChart').getContext('2d');
    if(chart) chart.destroy();
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: spy.map((_, i) => i),
            datasets: [
                { label: 'Portfolio (Primary)', data: ptf, borderColor: '#38bdf8', borderWidth: 2, pointRadius: 0 },
                { label: 'S&P 500', data: spy, borderColor: '#fbbf24', borderDash: [5,5], pointRadius: 0 },
                { label: 'Nasdaq', data: qqq, borderColor: '#a78bfa', borderDash: [5,5], pointRadius: 0 }
            ]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, 
        scales: { x: { display: false }, y: { ticks: { callback: v => v + '%' } } } }
    });
}

// 3. TABLE & PORTFOLIO LOGIC
async function refreshTable() {
    const body = document.getElementById('ptf-body');
    body.innerHTML = '';
    let totalVal = 0, totalCost = 0, dayChange = 0;

    for(let a of portfolio) {
        const q = await getLive(a.ticker);
        const equity = q.c * a.shares;
        const cost = a.avgCost * a.shares;
        const pl = ((q.c - a.avgCost) / a.avgCost) * 100;
        
        totalVal += equity;
        totalCost += cost;
        dayChange += q.dp;

        body.innerHTML += `
            <tr>
                <td><b style="color:var(--accent)">${a.ticker}</b></td>
                <td>${a.shares}</td>
                <td>$${a.avgCost}</td>
                <td>$${q.c.toFixed(2)}</td>
                <td>$${equity.toFixed(2)}</td>
                <td class="${pl >= 0 ? 'up' : 'down'}">${pl.toFixed(2)}%</td>
                <td onclick="removeAsset('${a.ticker}')" style="cursor:pointer; color:var(--red)">✕</td>
            </tr>
        `;
    }

    document.getElementById('v-total').textContent = `$${totalVal.toLocaleString()}`;
    const totalPL = totalCost > 0 ? ((totalVal - totalCost) / totalCost) * 100 : 0;
    document.getElementById('v-pl').textContent = `${totalPL.toFixed(2)}%`;
    document.getElementById('v-pl').className = `card-val ${totalPL >= 0 ? 'up' : 'down'}`;
    document.getElementById('v-day').textContent = `${(dayChange / (portfolio.length || 1)).toFixed(2)}%`;
}

function addAsset() {
    const t = document.getElementById('inT').value.toUpperCase();
    const s = parseFloat(document.getElementById('inS').value);
    const c = parseFloat(document.getElementById('inC').value);
    if(t && s && c) {
        portfolio.push({ticker:t, shares:s, avgCost:c});
        localStorage.setItem('my_stocks_v3', JSON.stringify(portfolio));
        refreshTable();
        loadChart(365);
    }
}

function removeAsset(t) {
    portfolio = portfolio.filter(a => a.ticker !== t);
    localStorage.setItem('my_stocks_v3', JSON.stringify(portfolio));
    refreshTable();
}

// INIT
refreshTable();
