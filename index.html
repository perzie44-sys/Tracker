<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Portfolio Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        :root {
            --bg:#07090f; --surface:#0c1018; --surface2:#111827;
            --border:#1a2535; --accent:#38bdf8; --green:#34d399; --red:#f87171;
            --text:#e2e8f0; --muted:#4b6080;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:20px;}
        .wrap{max-width:1100px;margin:0 auto;}
        
        /* Header & Cards */
        header{margin-bottom:30px; display:flex; justify-content:space-between; align-items:center;}
        .status{font-family:'Space Mono'; font-size:10px; color:var(--green); border:1px solid var(--green); padding:4px 8px; border-radius:4px;}
        .cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-bottom:30px;}
        .card{background:var(--surface); border:1px solid var(--border); padding:20px; border-radius:12px; position:relative;}
        .card::before{content:''; position:absolute; top:0; left:0; width:100%; height:3px; background:var(--accent);}
        .card-lbl{font-family:'Space Mono'; font-size:9px; text-transform:uppercase; color:var(--muted); margin-bottom:10px;}
        .card-val{font-size:24px; font-weight:800;}

        /* Table */
        .tbl-box{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; overflow-x:auto;}
        table{width:100%; border-collapse:collapse; font-size:13px;}
        th{text-align:left; padding:12px; color:var(--muted); font-family:'Space Mono'; font-size:10px; border-bottom:1px solid var(--border);}
        td{padding:15px 12px; border-bottom:1px solid rgba(26,37,53,0.5);}
        .up{color:var(--green);} .down{color:var(--red);}
        
        .fi{background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px; color:#fff; width:100px; margin-right:10px;}
        .btn{background:var(--accent); color:#000; border:none; padding:8px 15px; border-radius:6px; font-weight:700; cursor:pointer;}
    </style>
</head>
<body>

<div class="wrap">
    <header>
        <div>
            <h1 style="font-size:20px;">Live Portfolio Tracker</h1>
            <p style="font-size:10px; color:var(--muted)">Powered by Finnhub API</p>
        </div>
        <div id="status" class="status">● API Connected</div>
    </header>

    <div class="cards">
        <div class="card">
            <div class="card-lbl">Total Value (USD)</div>
            <div class="card-val" id="totalVal">$0.00</div>
        </div>
        <div class="card">
            <div class="card-lbl">Day Change</div>
            <div class="card-val" id="totalChange">0.00%</div>
        </div>
        <div class="card">
            <div class="card-lbl">Market Sentiment</div>
            <div class="card-val" id="marketMood">Checking...</div>
        </div>
    </div>

    <div class="tbl-box" style="margin-bottom:20px;">
        <h3 style="margin-bottom:15px; font-size:14px;">Add New Asset</h3>
        <input class="fi" id="newT" placeholder="Symbol (AAPL)">
        <input class="fi" id="newS" type="number" placeholder="Shares">
        <input class="fi" id="newC" type="number" placeholder="Avg Cost">
        <button class="btn" onclick="addAsset()">Add Asset</button>
    </div>

    <div class="tbl-box">
        <table>
            <thead>
                <tr>
                    <th>Symbol</th><th>Shares</th><th>Avg Cost</th><th>Live Price</th><th>Equity</th><th>P/L %</th><th>Action</th>
                </tr>
            </thead>
            <tbody id="tbl"></tbody>
        </table>
    </div>
</div>

<script>
// --- CONFIG ---
const API_KEY = 'd819jdhr01qler4hgci0d819jdhr01qler4hgcig';
let portfolio = JSON.parse(localStorage.getItem('finnhub_ptf') || '[{"ticker":"AAPL","shares":10,"avgCost":150}]');

// --- API FETCHING ---
async function getQuote(symbol) {
    try {
        const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${API_KEY}`);
        const data = await response.json();
        return data; // Returns {c: current, d: change, dp: percent change, h: high, l: low...}
    } catch (e) {
        console.error("API Error", e);
        return null;
    }
}

async function refreshAll() {
    let totalEquity = 0;
    let totalCost = 0;
    let dayChangeSum = 0;
    
    const tbody = document.getElementById('tbl');
    tbody.innerHTML = '';

    for (let asset of portfolio) {
        const quote = await getQuote(asset.ticker);
        if(!quote || quote.c === 0) continue;

        const livePrice = quote.c;
        const equity = livePrice * asset.shares;
        const costBasis = asset.avgCost * asset.shares;
        const plPct = ((livePrice - asset.avgCost) / asset.avgCost) * 100;
        
        totalEquity += equity;
        totalCost += costBasis;
        dayChangeSum += quote.dp;

        tbody.innerHTML += `
            <tr>
                <td><b style="color:var(--accent)">${asset.ticker}</b></td>
                <td>${asset.shares}</td>
                <td>$${asset.avgCost.toFixed(2)}</td>
                <td>$${livePrice.toFixed(2)}</td>
                <td>$${equity.toFixed(2)}</td>
                <td class="${plPct >= 0 ? 'up' : 'down'}">${plPct >= 0 ? '+' : ''}${plPct.toFixed(2)}%</td>
                <td><button onclick="removeAsset('${asset.ticker}')" style="background:none; border:none; color:var(--red); cursor:pointer">✕</button></td>
            </tr>
        `;
    }

    // Update Top Cards
    document.getElementById('totalVal').textContent = `$${totalEquity.toLocaleString(undefined, {maximumFractionDigits:2})}`;
    const avgDayChange = dayChangeSum / portfolio.length;
    document.getElementById('totalChange').textContent = `${avgDayChange >= 0 ? '+' : ''}${avgDayChange.toFixed(2)}%`;
    document.getElementById('totalChange').className = `card-val ${avgDayChange >= 0 ? 'up' : 'down'}`;
    
    // Fetch S&P 500 for Sentiment
    const spy = await getQuote('SPY');
    document.getElementById('marketMood').textContent = spy.dp >= 0 ? "Bullish 🐂" : "Bearish 🐻";
    document.getElementById('marketMood').style.color = spy.dp >= 0 ? "var(--green)" : "var(--red)";
}

// --- APP LOGIC ---
function addAsset() {
    const t = document.getElementById('newT').value.toUpperCase();
    const s = parseFloat(document.getElementById('newS').value);
    const c = parseFloat(document.getElementById('newC').value);
    
    if(t && s && c) {
        portfolio.push({ticker: t, shares: s, avgCost: c});
        save();
        refreshAll();
    }
}

function removeAsset(ticker) {
    portfolio = portfolio.filter(a => a.ticker !== ticker);
    save();
    refreshAll();
}

function save() {
    localStorage.setItem('finnhub_ptf', JSON.stringify(portfolio));
}

// Initial Load
refreshAll();
// Auto-refresh every 60 seconds
setInterval(refreshAll, 60000);

</script>
</body>
</html>
